    <path d="M173 286h374M214 238h292M250 198h220" stroke="#62f5ff" stroke-width="5" stroke-linecap="round" opacity=".78"/>
  </g>
  <rect x="321" y="247" width="78" height="100" rx="12" fill="#1987ff"/>
